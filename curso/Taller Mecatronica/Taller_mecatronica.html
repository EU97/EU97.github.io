<title>Taller Mecatrónica</title>
<meta name="description" content="Simuladores interactivos para descubrir la ingeniería en mecatrónica construyendo un rover autónomo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   TALLER MECATRÓNICA — sistema de tokens
   El color codifica los 3 dominios de la mecatrónica:
   MECÁNICA (músculos) · ELECTRÓNICA (señal) · SOFTWARE (cerebro)
   ============================================================ */
:root{
  --bg:#e7ebf0;
  --surface:#f6f8fb;
  --surface-2:#eef1f5;
  --ink:#151d27;
  --muted:#586675;
  --line:#cfd7e0;
  --line-strong:#aab6c3;

  --mech:#d1495b;   /* mecánica  — rojo */
  --elec:#1690a0;   /* electrónica — teal */
  --soft:#3f57ba;   /* software  — indigo */
  --mech-soft:#f7e6e9;
  --elec-soft:#dcf0f2;
  --soft-soft:#e3e7f8;

  --ok:#2e9e5b;
  --warn:#dd9a00;
  --bad:#cf3a3a;

  --accent:var(--elec);
  --shadow:0 1px 2px rgba(20,29,39,.06),0 6px 18px rgba(20,29,39,.08);
  --radius:14px;
  --radius-sm:9px;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161d;
    --surface:#1a212b;
    --surface-2:#212a35;
    --ink:#e8edf2;
    --muted:#93a1b0;
    --line:#2c3742;
    --line-strong:#3d4a57;

    --mech:#f0697a;
    --elec:#3fc0d0;
    --soft:#7d90e8;
    --mech-soft:#331c22;
    --elec-soft:#12333a;
    --soft-soft:#20263f;

    --ok:#43c07a;
    --warn:#f0b62e;
    --bad:#f0697a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11161d;
  --surface:#1a212b;
  --surface-2:#212a35;
  --ink:#e8edf2;
  --muted:#93a1b0;
  --line:#2c3742;
  --line-strong:#3d4a57;

  --mech:#f0697a;
  --elec:#3fc0d0;
  --soft:#7d90e8;
  --mech-soft:#331c22;
  --elec-soft:#12333a;
  --soft-soft:#20263f;

  --ok:#43c07a;
  --warn:#f0b62e;
  --bad:#f0697a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  background-position:-1px -1px;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

h1,h2,h3,h4{font-family:"Chakra Petch","IBM Plex Sans",sans-serif;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit}
code,kbd,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.tnum{font-variant-numeric:tabular-nums}

a{color:var(--soft)}

/* ---------- layout shell ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
header.top{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Chakra Petch";font-weight:700;letter-spacing:.02em;font-size:16px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--mech) 0 33%,var(--elec) 0 66%,var(--soft) 0);flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;color:var(--muted);
  padding:8px 11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:background .15s,color .15s;
}
.tab .n{font-family:"IBM Plex Mono";font-size:11px;opacity:.7}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--elec);outline-offset:2px}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:15px}

main{padding:28px 0 80px}
.module{display:none;animation:fade .25s ease}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.mhead{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-bottom:8px}
.mhead .kicker{font-family:"IBM Plex Mono";font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mhead h2{font-size:clamp(22px,3.4vw,32px)}
.mlede{color:var(--muted);max-width:70ch;margin-bottom:22px}

/* ---------- generic panels ---------- */
.grid{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-family:"IBM Plex Mono";font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase}
.tag.mech{background:var(--mech-soft);color:var(--mech)}
.tag.elec{background:var(--elec-soft);color:var(--elec)}
.tag.soft{background:var(--soft-soft);color:var(--soft)}

.canvas-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:auto;border-radius:var(--radius-sm);background:var(--surface-2);touch-action:none}

label.field{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
label.field .val{float:right;font-family:"IBM Plex Mono";font-weight:500;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:22px}
select,input[type=number]{font-family:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%}

.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .1s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.readout{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono";font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:transparent}

.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:10px;margin-top:12px}
.route{font-size:12.5px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:9px;padding:10px 12px;margin-top:14px}
.route b{font-family:"Chakra Petch"}

/* puente simulador <-> kit */
.simkit{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin:0 0 22px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.simkit>div{padding:14px 16px}
.simkit .sk-sim{background:var(--elec-soft)}
.simkit .sk-kit{background:var(--mech-soft)}
.simkit .sk-arrow{display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);font-size:20px;padding:0 10px}
.simkit .sk-h{font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
.simkit .sk-sim .sk-h{color:var(--elec)}
.simkit .sk-kit .sk-h{color:var(--mech)}
.simkit p{font-size:13px;line-height:1.5}
.simkit .sk-min{display:inline-block;margin-top:7px;font-family:"IBM Plex Mono";font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
@media(max-width:620px){.simkit{grid-template-columns:1fr}.simkit .sk-arrow{padding:6px;transform:rotate(90deg)}}

/* ---------- module 0 : inicio ---------- */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(22px,4vw,44px);box-shadow:var(--shadow);overflow:hidden;position:relative
}
.hero h2{font-size:clamp(26px,5vw,44px);letter-spacing:-.01em}
.hero .big{color:var(--muted);font-size:clamp(15px,2vw,18px);max-width:60ch;margin-top:14px}
.domains{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.domain{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;cursor:pointer;background:var(--surface-2);
  transition:transform .15s,border-color .15s;text-align:left
}
.domain:hover{transform:translateY(-3px)}
.domain[data-on="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.domain.m{color:var(--mech)}.domain.e{color:var(--elec)}.domain.s{color:var(--soft)}
.domain .ico{font-size:22px}
.domain h4{color:var(--ink);font-size:15px;margin:8px 0 4px}
.domain p{font-size:12.5px;color:var(--muted)}
.domain .anat{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;margin-top:8px;color:currentColor}
.assembled{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--ink);color:var(--surface);font-size:14px;display:none}
.assembled.show{display:block}
.assembled b{font-family:"Chakra Petch"}

/* ---------- module 1 : caja negra ---------- */
.bn-layout{display:grid;grid-template-columns:1fr;gap:18px}
.systems{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.syschip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.syschip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.part{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);font-size:13px}
.part .pn{font-weight:600;display:block;margin-bottom:8px}
.part .opts{display:flex;gap:4px}
.part .opts button{flex:1;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:6px;padding:5px 0;font-size:11px;font-weight:700;cursor:pointer;font-family:"IBM Plex Mono"}
.part.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.part.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.part .opts button[data-sel="true"].m{background:var(--mech);color:#fff;border-color:var(--mech)}
.part .opts button[data-sel="true"].e{background:var(--elec);color:#fff;border-color:var(--elec)}
.part .opts button[data-sel="true"].s{background:var(--soft);color:#fff;border-color:var(--soft)}
.scorebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.scorebar .big{font-family:"Chakra Petch";font-size:26px;font-weight:700}

/* ---------- module 3 : puente H ---------- */
.truth{border-collapse:collapse;width:100%;font-family:"IBM Plex Mono";font-size:13px;margin-top:8px}
.truth th,.truth td{border:1px solid var(--line);padding:7px 8px;text-align:center}
.truth th{background:var(--surface-2);font-weight:600}
.truth tr[data-live="true"] td{background:color-mix(in srgb,var(--elec) 16%,transparent)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tgl{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-family:"IBM Plex Mono";font-weight:600;font-size:13px;cursor:pointer}
.tgl[data-on="true"]{background:var(--soft);color:#fff;border-color:var(--soft)}
.wirelist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.wirelist li{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.wirelist li .st{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;font-weight:700}
.wirelist li.done{border-color:var(--ok)}
.wirelist li.done .st{color:var(--ok)}
.wirelist li.bad{border-color:var(--bad)}
.wirelist li.bad .st{color:var(--bad)}
.bankgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.bankcol .bh{font-family:"IBM Plex Mono";font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.bankcol .bh.mech{color:var(--mech)}.bankcol .bh.elec{color:var(--elec)}
.bankcol .pill{margin-top:10px;width:100%;justify-content:center;box-sizing:border-box}
.combo{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);font-family:"Chakra Petch";font-weight:700;font-size:14px}
.combo .ic{font-size:20px;line-height:1}
@media(max-width:520px){.bankgrid{grid-template-columns:1fr}}

/* ---------- module 4 : bloques ---------- */
.blocks{display:grid;gap:8px}
.block{
  border:1px solid var(--line-strong);border-left:5px solid var(--soft);border-radius:8px;
  background:var(--surface);padding:10px 12px;font-size:13px
}
.block.sense{border-left-color:var(--elec)}
.block.act{border-left-color:var(--mech)}
.block.ctrl{border-left-color:var(--soft)}
.block .bh{display:flex;align-items:center;gap:8px;font-weight:600}
.block .bh input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.block .params{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;padding-left:24px}
.block .params label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.block .params input,.block .params select{width:auto;min-width:88px;padding:4px 6px;font-size:12px}
.codebox{background:#0d1117;color:#c9d1d9;border-radius:var(--radius-sm);padding:14px;font-family:"IBM Plex Mono";font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre;border:1px solid var(--line)}
.codebox .kw{color:#ff7b72}.codebox .fn{color:#d2a8ff}.codebox .nu{color:#79c0ff}.codebox .cm{color:#8b949e}

/* ---------- diagrams (árbol de decisión / flujo de datos) ---------- */
.diagram{width:100%;height:auto;margin-top:10px;overflow:visible}
.diagram text{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink)}
.diagram .lbl{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:12px}
.diagram .small{font-size:10px;fill:var(--muted)}
.diagram .arrow{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#tm-arrow)}
.diagram .box{stroke-width:1.6;fill:var(--surface)}
.diagram .box.sense{stroke:var(--elec)}
.diagram .box.ctrl{stroke:var(--soft)}
.diagram .box.act{stroke:var(--mech)}
.diagram .box.core0{stroke:var(--elec);fill:var(--elec-soft)}
.diagram .box.core1{stroke:var(--mech);fill:var(--mech-soft)}
.diagram .box.shared{stroke:var(--soft);fill:var(--soft-soft)}
.diagram-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-top:14px}
.diagram-shell h3{font-size:14px;margin-bottom:2px}
.diagram-shell .cap{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- module 06 : checklist ---------- */
.cl-progress{display:flex;align-items:center;gap:10px;margin:4px 0 22px}
.cl-bar{flex:1;height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.cl-bar span{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
.cl-pct{font-family:"IBM Plex Mono";font-size:13px;font-weight:700;color:var(--ok);min-width:42px;text-align:right}
.cl-sec{margin-bottom:18px}
.cl-sec .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cl-sec .sh h4{font-size:14.5px;font-family:"Chakra Petch"}
.cl-sec .sh .when{font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.cl-sec .sh .mini{margin-left:auto;font-family:"IBM Plex Mono";font-size:11.5px;font-weight:700;color:var(--muted)}
.cl-items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cl-items li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
.cl-items li input{margin-top:3px;width:16px;height:16px;accent-color:var(--ok);flex:none;pointer-events:none}
.cl-items li.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.cl-items li.done .cl-txt{text-decoration:line-through;opacity:.6}
.cl-items li small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:400;text-decoration:none!important;opacity:1!important}

/* ---------- telemetry dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;box-shadow:var(--shadow)}
.tile .k{font-family:"IBM Plex Mono";font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:"Chakra Petch";font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:3px}
.tile .u{font-size:12px;color:var(--muted);font-family:"IBM Plex Sans"}
.tile.state .v{font-size:18px}
.bars{display:flex;gap:10px;align-items:flex-end;height:44px;margin-top:6px}
.bars .b{flex:1;background:var(--surface-2);border-radius:4px 4px 0 0;position:relative;overflow:hidden}
.bars .b span{position:absolute;left:0;right:0;bottom:0;background:var(--mech)}
.bars .b.r span{background:var(--elec)}
.spark{width:100%;height:44px;display:block;margin-top:4px}
.compass{display:block;margin:2px auto 0}

.dash-mini{grid-template-columns:repeat(4,1fr);margin-top:12px}
.dash-mini .tile{padding:9px 10px}
.dash-mini .tile .v{font-size:19px}
.dash-mini .bars{height:30px}
@media(max-width:640px){.dash-mini{grid-template-columns:repeat(2,1fr)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ---------- module 07 : prueba física ---------- */
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field-grid .full{grid-column:1/-1}
.field-grid textarea,.field-grid input[type=text],.field-grid input[type=date],.field-grid select{
  width:100%;font-family:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink)
}
.field-grid textarea{min-height:110px;resize:vertical}
.savebadge{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-bars{display:grid;gap:10px}
.timeline-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.timeline-step{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.timeline-step .mono{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.timeline-step strong{display:block;font-size:14px;margin-bottom:4px}
.upload-graphic{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}

/* ============================================================
   MOTOR compartido: física simple de rover diferencial
   ============================================================ */
const MOTORS={ // rpm sin carga @ voltaje nominal
  "tt-200":{rpm:200,label:"TT amarillo (200 rpm)"},
  "tt-90":{rpm:90,label:"TT con reductora (90 rpm)"},
  "n20-320":{rpm:320,label:"N20 rápido (320 rpm)"},
};
function pwmToSpeed(pwm, wheelDiamCm, motorRpm){
  // cm/s ideal; se aplica ~65% de eficiencia bajo carga
  const rps=(pwm/255)*(motorRpm/60);
  return rps*Math.PI*wheelDiamCm*0.65;
}
class RoverSim{
  constructor(){this.reset();}
  reset(x=40,y=40,h=0){
    this.x=x;this.y=y;this.h=h;         // cm, cm, rad
    this.pwmL=0;this.pwmR=0;this.dir=1; // dir: 1 fwd, -1 rev per side handled via signed pwm
    this.sL=0;this.sR=0;               // cm/s
    this.trackCm=11; this.wheelDiam=6.5; this.motorRpm=200;
    this.collisions=0; this.t=0; this.dist=200; this.state="—";
    this.trail=[];
  }
  step(dt, obstacles, arenaW, arenaH){
    this.sL=pwmToSpeed(Math.abs(this.pwmL),this.wheelDiam,this.motorRpm)*Math.sign(this.pwmL);
    this.sR=pwmToSpeed(Math.abs(this.pwmR),this.wheelDiam,this.motorRpm)*Math.sign(this.pwmR);
    const v=(this.sL+this.sR)/2, w=(this.sR-this.sL)/this.trackCm;
    const nx=this.x+Math.cos(this.h)*v*dt, ny=this.y+Math.sin(this.h)*v*dt;
    this.h+=w*dt;
    // colisión: radio del rover ~9 cm
    let hit=false;
    for(const o of obstacles){
      const d=Math.hypot(nx-o.x,ny-o.y);
      if(d<o.r+9){hit=true;break;}
    }
    if(nx<9||ny<9||nx>arenaW-9||ny>arenaH-9) hit=true;
    if(hit){ this.collisions++; this.x-=Math.cos(this.h)*6; this.y-=Math.sin(this.h)*6; }
    else { this.x=nx; this.y=ny; }
    this.t+=dt;
    this.trail.push([this.x,this.y]); if(this.trail.length>400)this.trail.shift();
  }
  readUltrasonic(obstacles, arenaW, arenaH){
    // raycast frontal, tope 200 cm, + ruido
    let best=200;
    for(let d=6; d<200; d+=2){
      const px=this.x+Math.cos(this.h)*d, py=this.y+Math.sin(this.h)*d;
      if(px<0||py<0||px>arenaW||py>arenaH){best=d;break;}
      let blocked=false;
      for(const o of obstacles){ if(Math.hypot(px-o.x,py-o.y)<o.r){blocked=true;break;} }
      if(blocked){best=d;break;}
    }
    best+=(Math.random()-0.5)*1.4;
    this.dist=Math.max(2,best);
    return this.dist;
  }
}

/* dibujar arena + rover en un canvas (escala cm->px) */
function drawArena(ctx,cv,sim,obstacles,arenaW,arenaH,opts={}){
  const s=cv.width/arenaW;
  ctx.clearRect(0,0,cv.width,cv.height);
  const css=getComputedStyle(document.documentElement);
  const ink=css.getPropertyValue('--ink').trim();
  const line=css.getPropertyValue('--line').trim();
  const surf2=css.getPropertyValue('--surface-2').trim();
  const mech=css.getPropertyValue('--mech').trim();
  const elec=css.getPropertyValue('--elec').trim();
  const soft=css.getPropertyValue('--soft').trim();
  ctx.fillStyle=surf2;ctx.fillRect(0,0,cv.width,cv.height);
  // grid
  ctx.strokeStyle=line;ctx.lineWidth=1;
  for(let g=0;g<=arenaW;g+=20){ctx.beginPath();ctx.moveTo(g*s,0);ctx.lineTo(g*s,cv.height);ctx.stroke();}
  for(let g=0;g<=arenaH;g+=20){ctx.beginPath();ctx.moveTo(0,g*s);ctx.lineTo(cv.width,g*s);ctx.stroke();}
  // finish
  if(opts.finish){
    ctx.fillStyle=soft;ctx.globalAlpha=.18;
    ctx.fillRect(opts.finish.x*s,opts.finish.y*s,opts.finish.w*s,opts.finish.h*s);
    ctx.globalAlpha=1;
    ctx.strokeStyle=soft;ctx.setLineDash([6,4]);
    ctx.strokeRect(opts.finish.x*s,opts.finish.y*s,opts.finish.w*s,opts.finish.h*s);
    ctx.setLineDash([]);
  }
  // obstacles
  obstacles.forEach(o=>{
    ctx.beginPath();ctx.arc(o.x*s,o.y*s,o.r*s,0,7);
    ctx.fillStyle=mech;ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
  });
  // trail
  if(sim.trail.length>1){
    ctx.beginPath();ctx.moveTo(sim.trail[0][0]*s,sim.trail[0][1]*s);
    sim.trail.forEach(p=>ctx.lineTo(p[0]*s,p[1]*s));
    ctx.strokeStyle=soft;ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
  }
  // ultrasonic cone
  ctx.save();ctx.translate(sim.x*s,sim.y*s);ctx.rotate(sim.h);
  ctx.beginPath();ctx.moveTo(9*s,0);
  ctx.arc(0,0,Math.min(sim.dist,200)*s,-0.18,0.18);
  ctx.closePath();ctx.fillStyle=elec;ctx.globalAlpha=.16;ctx.fill();ctx.globalAlpha=1;
  // body
  ctx.fillStyle=ink;ctx.strokeStyle=ink;
  ctx.beginPath();ctx.roundRect(-9*s,-7*s,18*s,14*s,3);ctx.fill();
  ctx.fillStyle=elec;ctx.fillRect(7*s,-3*s,3*s,6*s); // sensor
  // wheels
  ctx.fillStyle=mech;
  ctx.fillRect(-8*s,-8.5*s,7*s,2.4*s);ctx.fillRect(1*s,-8.5*s,7*s,2.4*s);
  ctx.fillRect(-8*s,6.1*s,7*s,2.4*s);ctx.fillRect(1*s,6.1*s,7*s,2.4*s);
  ctx.restore();
}

BUILDERS.cajanegra={build(p){
  p.innerHTML=`
   <div class="mhead"><span class="kicker">Módulo 01</span><h2>Desglose de caja negra</h2></div>
   <p class="mlede">Elige un sistema real y clasifica cada componente en su dominio: <b style="color:var(--mech)">Mecánica</b>, <b style="color:var(--elec)">Electrónica</b> o <b style="color:var(--soft)">Software</b>. Es el mismo reto relámpago que harás en equipo.</p>
   ${simKitHTML(
     "Clasificas los componentes de un dron, un dispensador o un brazo robótico y el simulador te dice si acertaste.",
     "Cada rol del grupo (mecánica / electrónica / software) nombra en voz alta lo que ve en el objeto real. Sirve para decidir qué celda hace qué.",
     "de arranque")}
   <div class="systems" id="sys"></div>
   <div class="card">
     <div class="parts" id="parts"></div>
     <div class="scorebar">
       <button class="btn primary" id="check">Revisar clasificación</button>
       <span class="big readout" id="score">0 / 0</span>
       <span class="pill" id="verdict">Sin revisar</span>
     </div>
     <p class="note" id="fb"></p>
   </div>
   <div class="route"><b>En la carrera:</b> este pensamiento de "descomponer un sistema en subsistemas" es la base de <b>Diseño Mecatrónico</b> (4º sem) y <b>Ciencias de la Ingeniería</b> (1er sem).</div>`;
  const sysEl=$("#sys",p), partsEl=$("#parts",p);
  let curSys="dron";
  Object.entries(SYSTEMS).forEach(([k,v])=>{
    const c=el("button","syschip",v.name);
    c.setAttribute("aria-pressed",k===curSys);
    c.onclick=()=>{curSys=k; sysEl.querySelectorAll(".syschip").forEach(x=>x.setAttribute("aria-pressed","false")); c.setAttribute("aria-pressed","true"); render();};
    sysEl.appendChild(c);
  });
  let sel={};
  function render(){
    sel={}; partsEl.innerHTML="";
    $("#score",p).textContent="0 / "+SYSTEMS[curSys].parts.length;
    $("#verdict",p).textContent="Sin revisar";$("#verdict",p).className="pill";
    $("#fb",p).textContent="";
    SYSTEMS[curSys].parts.forEach((pt,i)=>{
      const d=el("div","part");
      d.innerHTML=`<span class="pn">${pt.n}</span>

  };
  render();
}};

       <div class="btnrow" style="margin-top:4px">
         <button class="btn go" id="play">▶ Avanzar solo</button>
         <button class="btn" id="reset">Reiniciar</button>
       </div>
       <label class="field" style="margin-top:16px">Altura de la piedra <span class="val" id="vh">4 cm</span></label>
       <input type="range" id="h" min="0" max="6" step="0.5" value="4">
       <div class="btnrow">
         <button class="btn" data-h="0">Llano</button>
         <button class="btn" data-h="2.5">Piedra chica</button>
         <button class="btn" data-h="5">Piedra grande</button>
       </div>
       <label class="field" style="margin-top:16px;display:flex;align-items:center;gap:8px"><input type="checkbox" id="rigid" style="width:16px;height:16px" checked> Comparar con eje rígido (sin suspensión)</label>
       <p class="note">Vista lateral esquemática, no a escala. El cuerpo real pivota sobre <b>2 rockers</b> unidos por una <b>barra diferencial</b>: esta vista de un solo lado sobreestima un poco la inclinación — la barra la reparte entre los dos lados.</p>
     </div>
     <div>
       <div class="canvas-shell"><canvas id="cv" width="720" height="380"></canvas></div>
       <div class="dash" style="grid-template-columns:repeat(3,1fr)">
         <div class="tile"><div class="k">Cuerpo · rocker-bogie</div><div class="v tnum" id="oPitchRB">0°</div><div class="u">inclinación</div></div>
         <div class="tile"><div class="k">Cuerpo · eje rígido</div><div class="v tnum" id="oPitchRig">0°</div><div class="u">inclinación</div></div>
         <div class="tile"><div class="k">Eje rígido</div><div class="v" id="oFloat" style="font-size:15px">—</div><div class="u">rueda central</div></div>
       </div>
       <p class="note" id="advice"></p>
     </div>
   </div>
   <div class="route"><b>En la carrera:</b> este mecanismo se calcula con <b>Mecánica de Materiales</b> y <b>Matemáticas Avanzadas</b> (3er sem), se integra en <b>Diseño Mecatrónico</b> (4º) y las piezas se diseñan en 3D en <b>Dibujo Computarizado</b> (1er sem) — exactamente lo que vas a armar hoy.</div>`;
  const cv=$("#cv",p), ctx=cv.getContext("2d");
  const get=id=>$("#"+id,p);
  // geometría del esquema (cm, no a escala real del STL)
  const dxFrontMid=24, dxMidRear=18, wheelR=6.2, bodyRatio=0.42, track=140;
  function groundH(x,hMax){ const c=track*0.62, w=11; const d=Math.abs(x-c); return d>w?0:hMax*0.5*(1+Math.cos(Math.PI*d/w)); }
  let raf=null, playing=false;
  function upd(){
    const posPct=+get("pos").value, hMax=+get("h").value, showRigid=get("rigid").checked;
    get("vpos").textContent=posPct+"%";
    get("vh").textContent=hMax.toFixed(1)+" cm";
    const xFront=20+posPct/100*(track-40);
    const xMid=xFront-dxFrontMid, xRear=xFront-dxFrontMid-dxMidRear;
    const yFront=groundH(xFront,hMax), yMid=groundH(xMid,hMax), yRear=groundH(xRear,hMax);
    // rocker-bogie
    const bogiePX=(xMid+xRear)/2, bogiePY=(yMid+yRear)/2;
    const rockerAngRad=Math.atan2(yFront-bogiePY, xFront-bogiePX);
    const rockerAngDeg=rockerAngRad*180/Math.PI;
    const bodyPitchRB=rockerAngDeg/2; // la barra diferencial promedia con el otro lado
    // eje rígido: línea directa front-rear; la rueda de en medio puede flotar o atorarse
    const rigidAngRad=Math.atan2(yFront-yRear, xFront-xRear);
    const rigidAngDeg=rigidAngRad*180/Math.PI;
    const t=(xMid-xRear)/(xFront-xRear);
    const rigidYatMid=yRear+(yFront-yRear)*t;
    const midGap=rigidYatMid-yMid; // + = la rueda del medio queda en el aire
    get("oPitchRB").textContent=bodyPitchRB.toFixed(1)+"°";
    get("oPitchRig").textContent=(showRigid?rigidAngDeg:0).toFixed(1)+"°";
    const fl=get("oFloat");
    if(!showRigid){fl.textContent="—";fl.style.color="var(--muted)";}
    else if(midGap>0.5){fl.textContent="en el aire";fl.style.color="var(--bad)";}
    else if(midGap<-0.5){fl.textContent="se atora";fl.style.color="var(--warn)";}
    else {fl.textContent="toca el piso";fl.style.color="var(--ok)";}
    let a=[];
    if(Math.abs(bodyPitchRB)<0.5) a.push("Terreno llano o las 3 ruedas ya se acomodaron: el cuerpo va casi nivelado.");
    else a.push("La rueda delantera está subiendo la piedra; el rocker pivota y absorbe la mayor parte — el cuerpo apenas se nota.");
    if(showRigid && Math.abs(rigidAngDeg)>Math.abs(bodyPitchRB)+1) a.push("El eje rígido, en cambio, transmite casi toda la altura de la piedra directo al cuerpo.");
    if(showRigid && midGap>0.5) a.push("Con eje rígido, la rueda del medio se queda sin tocar el piso — pierde tracción justo ahí.");
    get("advice").innerHTML=a.join(" ");
    draw(xFront,xMid,xRear,yFront,yMid,yRear,bogiePX,bogiePY,hMax,showRigid,rigidYatMid,midGap);
  }
  function wheel(ctx,x,y,r,color){
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="rgba(0,0,0,.3)";ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill(); // eje
  }
  function armTo(ctx,x1,y1,x2,y2,rTrim,color,w){
    const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1, ux=dx/d,uy=dy/d;
    ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x1+ux*rTrim,y1+uy*rTrim);ctx.lineTo(x2-ux*rTrim,y2-uy*rTrim);ctx.stroke();
  }
  function draw(xFront,xMid,xRear,yFront,yMid,yRear,bogiePX,bogiePY,hMax,showRigid,rigidYatMid,midGap){
    const css=getComputedStyle(document.documentElement);
    const ink=css.getPropertyValue('--ink').trim(), line=css.getPropertyValue('--line').trim();
    const surf2=css.getPropertyValue('--surface-2').trim(), mech=css.getPropertyValue('--mech').trim();
    const soft=css.getPropertyValue('--soft').trim(), warn=css.getPropertyValue('--warn').trim(), bad=css.getPropertyValue('--bad').trim();
    ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle=surf2;ctx.fillRect(0,0,cv.width,cv.height);
    const S=4.6, ox=40, drawR=wheelR*S*0.62;
    function panel(oy,label,x1,y1,x2,y2,x3,y3,bpX,bpY,color,rigid){
      ctx.save();ctx.translate(ox,oy);
      ctx.fillStyle=ink;ctx.font="600 12px 'Chakra Petch'";ctx.fillText(label,0,-64);
      // terreno
      ctx.strokeStyle=line;ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let xx=0;xx<=track;xx+=2){ const yy=groundH(xx,hMax); const px=xx*S, py=-yy*S; if(xx===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.stroke();
      ctx.beginPath();
      for(let xx=0;xx<=track;xx+=2){ const yy=groundH(xx,hMax); const px=xx*S, py=-yy*S; if(xx===0)ctx.moveTo(px,20); ctx.lineTo(px,py); }
      ctx.lineTo(track*S,20);ctx.closePath();ctx.fillStyle="rgba(0,0,0,.05)";ctx.fill();
      const P=(x,y)=>[x*S,-y*S-wheelR*S];
      const [fx,fy]=P(x1,y1), [mx,my]=P(x2,y2), [rx,ry]=P(x3,y3);
      if(!rigid){
        const [bpx,bpy]=P(bpX,bpY);
        const bodyPX=bpx+(fx-bpx)*bodyRatio, bodyPY=bpy+(fy-bpy)*bodyRatio;
        wheel(ctx,fx,fy,drawR,color);wheel(ctx,mx,my,drawR,color);wheel(ctx,rx,ry,drawR,color);
        armTo(ctx,mx,my,rx,ry,drawR*0.9,mech,7);            // bogie: rueda media <-> rueda trasera
        armTo(ctx,bpx,bpy,fx,fy,drawR*0.9,soft,7);          // rocker: pivote bogie <-> rueda delantera
        ctx.save();ctx.translate(bodyPX,bodyPY);ctx.rotate(Math.atan2(fy-bpy,fx-bpx));
        ctx.fillStyle=ink;ctx.beginPath();ctx.roundRect(-42,-14,84,14,4);ctx.fill();
        ctx.restore();
        [[bpx,bpy],[bodyPX,bodyPY]].forEach(([px,py])=>{ ctx.beginPath();ctx.arc(px,py,4.5,0,7);ctx.fillStyle=warn;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.stroke(); });
      } else {
        wheel(ctx,fx,fy,drawR,color);wheel(ctx,mx,my,drawR,color);wheel(ctx,rx,ry,drawR,color);
        armTo(ctx,rx,ry,fx,fy,drawR*0.9,ink,11);            // cuerpo rígido: rueda trasera <-> delantera
        const [mrx,mry]=P(x2,rigidYatMid);
        ctx.strokeStyle=Math.abs(midGap)>0.5?bad:line;ctx.setLineDash([3,3]);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(mrx,mry);ctx.lineTo(mx,my);ctx.stroke();ctx.setLineDash([]);
      }
      ctx.restore();
    }
    panel(120,"Rocker-Bogie",xFront,yFront,xMid,yMid,xRear,yRear,bogiePX,bogiePY,soft,false);
    if(showRigid) panel(300,"Eje rígido (sin suspensión)",xFront,yFront,xMid,yMid,xRear,yRear,bogiePX,bogiePY,mech,true);
  }
  get("h").addEventListener("input",upd);
  get("pos").addEventListener("input",upd);
  get("rigid").addEventListener("change",upd);
  p.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{get("h").value=b.dataset.h;upd();});
  get("play").onclick=()=>{
    if(playing){playing=false;cancelAnimationFrame(raf);get("play").textContent="▶ Avanzar solo";return;}
    playing=true;get("play").textContent="⏸ Pausar";
    const step=()=>{
      let v=+get("pos").value+0.6; if(v>100)v=0;
      get("pos").value=v; upd();
      if(playing) raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
  };
  get("reset").onclick=()=>{playing=false;cancelAnimationFrame(raf);get("play").textContent="▶ Avanzar solo";get("pos").value=70;get("h").value=4;get("rigid").checked=true;upd();};
  upd();
  BUILDERS.chasis.stop=()=>{playing=false;cancelAnimationFrame(raf);};
}};

/* ---------- 03 · PUENTE H ---------- */
const WIRES=[
  {id:"pwr+", from:"Power bank 5 V (+) vía interruptor", to:"L298N · VMS / +12V", ok:true, why:"la potencia de los 2 bancos de motores entra por aquí (misma fuente que todo el rover)"},
  {id:"gnd",  from:"L298N · GND", to:"ESP32 · GND", ok:true, why:"TIERRA COMÚN: sin esto, el driver no entiende las señales"},
  {id:"log5v", from:"L298N · +5V (sin jumper del regulador)", to:"ESP32 · 5V", ok:true, why:"a 5V de entrada el regulador interno del L298N no funciona: se puentea directo a la misma línea de 5V"},
  {id:"m1",   from:"Banco izq. (3 motores en paralelo)", to:"L298N · OUT1 / OUT2", ok:true, why:"salida de potencia al banco de motores"},
  {id:"m2",   from:"Banco der. (3 motores en paralelo)", to:"L298N · OUT3 / OUT4", ok:true, why:"salida de potencia al banco de motores"},
  {id:"in",   from:"ESP32 GPIO 26/27 · 14/12", to:"L298N · IN1/IN2 · IN3/IN4", ok:true, why:"dirección de cada banco (adelante/atrás)"},
  {id:"pwm",  from:"ESP32 GPIO 25/33 (PWM)", to:"L298N · ENA / ENB", ok:true, why:"velocidad de cada banco — hay que quitar los jumpers de ENA/ENB del módulo"},
  {id:"trig", from:"ESP32 GPIO 5", to:"HC-SR04 · TRIG", ok:true, why:"disparo del pulso ultrasónico"},
  {id:"echo", from:"ESP32 GPIO 18 ← divisor 1k/2k", to:"HC-SR04 · ECHO", ok:true, why:"el eco llega a 5 V; el divisor lo baja a 3.3 V para el ESP32"},
];
const TRAPS=[
  {id:"trap1", from:"ESP32 · pin 3V3", to:"Motores (directo)", ok:false, why:"❌ NUNCA: la corriente de los motores quema el pin del microcontrolador. Para eso existe el puente H L298N."},
  {id:"trap2", from:"HC-SR04 · ECHO (5 V)", to:"ESP32 GPIO 18 (directo)", ok:false, why:"❌ El ESP32 es de 3.3 V: 5 V directo al GPIO lo daña. El ECHO debe pasar por el divisor de voltaje 1 kΩ / 2 kΩ."},
];
BUILDERS.puenteh={build(p){
  p.innerHTML=`
   <div class="mhead"><span class="kicker">Módulo 03 · Electrónica</span><h2>Cableado y puente H</h2></div>

   ${simKitHTML(
     "Conectas cada cable (power bank, L298N, bancos de motores, tierra común, sensor) y evitas las trampas ⚡ hasta obtener <b>verde total</b>. Practicas la tabla de verdad IN1/IN2/PWM.",
     "El <b>mini-diagrama de pines</b> (GPIO 26/27+ENA25 → banco izq. · 14/12+ENB33 → banco der. · 5 TRIG · 18 ECHO por divisor) y una frase de qué hace el puente H. En el reto conectas las 3 líneas que faltan del rover.",
     "⚡ Electrónica")}
   <div class="grid two">
     <div class="card">
       <h3><span class="tag elec">conexiones</span> Circuito del rover</h3>
       <p style="font-size:13px;color:var(--muted)">Marca cada conexión como la harías. Las trampas ⚡ son errores clásicos: déjalas <b>sin marcar</b>.</p>
       <ul class="wirelist" id="wl"></ul>
       <div class="btnrow">
         <button class="btn primary" id="verify">Verificar circuito</button>
         <span class="pill" id="wverdict">0 / ${WIRES.length}</span>
       </div>
     </div>
     <div>
       <div class="card">
         <h3><span class="tag soft">control</span> Control de los 2 bancos — el L298N completo</h3>
         <p style="font-size:12.5px;color:var(--muted);margin-bottom:2px">El rover no tiene 1 motor: tiene <b>2 bancos de 3</b>. Muévelos por separado y mira qué hace el rover completo.</p>
         <div class="bankgrid">
           <div class="bankcol">
             <div class="bh mech">BANCO IZQUIERDO · canal A</div>
             <div class="toggles"><button class="tgl" data-k="in1" data-on="false">IN1</button><button class="tgl" data-k="in2" data-on="false">IN2</button></div>
             <label class="field" style="margin-top:10px">ENA · PWM <span class="val" id="vpwmL">180</span></label>
             <input type="range" id="pwmL" min="0" max="255" value="180">
             <div class="pill" id="stL">—</div>
           </div>
           <div class="bankcol">
             <div class="bh elec">BANCO DERECHO · canal B</div>
             <div class="toggles"><button class="tgl" data-k="in3" data-on="false">IN3</button><button class="tgl" data-k="in4" data-on="false">IN4</button></div>
             <label class="field" style="margin-top:10px">ENB · PWM <span class="val" id="vpwmR">180</span></label>
             <input type="range" id="pwmR" min="0" max="255" value="180">
             <div class="pill" id="stR">—</div>
           </div>
         </div>
         <div class="combo" id="combo"><span class="ic" id="comboIcon">○</span><span id="comboLabel">Apagado</span></div>
         <table class="truth" id="truth" style="margin-top:14px">
           <tr><th>EN_</th><th>IN_1</th><th>IN_2</th><th>Resultado</th></tr>
           <tr data-r="off"><td>0</td><td>X</td><td>X</td><td>Apagado</td></tr>
           <tr data-r="coast"><td>PWM</td><td>0</td><td>0</td><td>Libre (inercia)</td></tr>
           <tr data-r="fwd"><td>PWM</td><td>1</td><td>0</td><td>Adelante</td></tr>
           <tr data-r="rev"><td>PWM</td><td>0</td><td>1</td><td>Atrás</td></tr>
           <tr data-r="brake"><td>PWM</td><td>1</td><td>1</td><td>Freno</td></tr>
         </table>
         <p class="note">La misma tabla aplica a los 2 canales (ENA/IN1/IN2 = izq. · ENB/IN3/IN4 = der.). Quitar los jumpers de ENA/ENB del módulo para que el PWM del ESP32 controle la velocidad.</p>
       </div>
       <div class="canvas-shell" style="margin-top:14px"><canvas id="motcv" width="560" height="260"></canvas></div>
     </div>
   </div>
   <div class="route"><b>En la carrera:</b> <b>Circuitos Eléctricos y Electrónicos</b> (3er sem) y <b>Automatización Industrial</b> (4º). El mismo principio de puente H mueve bandas transportadoras y ejes de robots industriales.</div>`;
  const wl=$("#wl",p);
  const allW=[...WIRES.slice(0,3),TRAPS[0],...WIRES.slice(3,6),TRAPS[1],...WIRES.slice(6)];
  const marked={};
  allW.forEach(w=>{
    const li=el("li");
    li.innerHTML=`<input type="checkbox" aria-label="conectar ${w.from} a ${w.to}"> <span>${w.ok?"":"⚡ "}<b>${w.from}</b> → ${w.to}</span><span class="st">—</span>`;
    li.querySelector("input").onchange=e=>{marked[w.id]=e.target.checked;};
    wl.appendChild(li);
    w._li=li;
  });
  $("#verify",p).onclick=()=>{
    let good=0,bad=0;
    allW.forEach(w=>{
      w._li.classList.remove("done","bad");
      const m=!!marked[w.id];
      if(w.ok && m){w._li.classList.add("done");w._li.querySelector(".st").textContent="OK";good++;}

      else if(!w.ok && m){w._li.classList.add("bad");w._li.querySelector(".st").textContent="⚡ ERROR";bad++;}

    v.textContent=good+" / "+WIRES.length+(bad?"  · "+bad+" error(es)":"");
    v.className="pill "+(good===WIRES.length&&!bad?"ok":bad?"bad":"warn");
    if(bad){ $("#fbwire",p)?.remove();
      const n=el("p","note",TRAPS.find(t=>marked[t.id]).why); n.id="fbwire";

  const mcv=$("#motcv",p), mx=mcv.getContext("2d");
  let angL=0, angR=0;
  function bankState(pwmId,i1k,i2k){

    if(pwm===0) return {mode:"off",pwm,w:0,label:"Apagado"};
    if(!i1&&!i2) return {mode:"coast",pwm,w:0,label:"Libre"};
    if(i1&&i2) return {mode:"brake",pwm,w:0,label:"Freno"};
    if(i1) return {mode:"fwd",pwm,w:(pwm/255)*0.28,label:"Adelante"};
    return {mode:"rev",pwm,w:-(pwm/255)*0.28,label:"Atrás"};
  }
  function combinar(L,R){
    const near=Math.abs(L.pwm-R.pwm)<15;
    if(L.mode==="brake"&&R.mode==="brake") return {label:"Frenado total (los 2 bancos)",icon:"■"};
    if((L.mode==="off"||L.mode==="coast")&&(R.mode==="off"||R.mode==="coast")) return {label:"Libre / detenido",icon:"○"};
    if(L.mode==="fwd"&&R.mode==="fwd") return near?{label:"Avanza recto",icon:"▲"}:{label:"Avanza en curva hacia "+(L.pwm<R.pwm?"la izquierda":"la derecha"),icon:L.pwm<R.pwm?"↰":"↱"};

    if(L.mode==="fwd"&&R.mode==="rev") return {label:"Gira sobre su eje → a la derecha",icon:"↻"};
    if(L.mode==="rev"&&R.mode==="fwd") return {label:"Gira sobre su eje → a la izquierda",icon:"↺"};

  function frame(){

    $("#comboIcon",p).textContent=c.icon; $("#comboLabel",p).textContent="El rover: "+c.label;

    mx.clearRect(0,0,mcv.width,mcv.height);mx.fillStyle=surf2;mx.fillRect(0,0,mcv.width,mcv.height);
    // vista superior del rover: cuerpo + 3 ruedas por banco, giran según su banco
    const cx=mcv.width/2, cy=mcv.height/2-10;
    mx.save();mx.translate(cx,cy);
    mx.fillStyle=ink; mx.fillRect(-46,-70,92,140);
    mx.strokeStyle=line; mx.lineWidth=2; mx.strokeRect(-46,-70,92,140);
    // sensor (frente)
    mx.fillStyle=elec; mx.fillRect(-10,-78,20,10);
    const wheelCol=(side,ang,col)=>{
      const x=side*72;
      for(let i=0;i<3;i++){
        const y=-46+i*46;
        mx.save(); mx.translate(x,y); mx.rotate(ang);
        mx.fillStyle=col; mx.fillRect(-11,-20,22,40);
        mx.strokeStyle=surf2; mx.lineWidth=2;
        for(let k=0;k<3;k++){mx.beginPath();mx.moveTo(0,0);mx.rotate(Math.PI/1.5);mx.lineTo(0,-16);mx.stroke();}
        mx.restore();
      }
    };
    wheelCol(-1,angL,mech); wheelCol(1,angR,elec);
    mx.restore();
    mx.fillStyle=mech; mx.font="600 12px 'IBM Plex Mono'"; mx.textAlign="center";
    mx.fillText("IZQ",cx-72,cy-92);
    mx.fillStyle=elec; mx.fillText("DER",cx+72,cy-92);
    mx.textAlign="left";
    // flecha de resultado combinado, abajo
    mx.font="600 22px 'Chakra Petch'"; mx.fillStyle=ink; mx.textAlign="center";
    mx.fillText(c.icon, cx, mcv.height-30);
    mx.font="600 13px 'Chakra Petch'";
    mx.fillText(c.label, cx, mcv.height-10);
    mx.textAlign="left"; mx.font="10.5px 'IBM Plex Mono'"; mx.fillStyle=muted;
    mx.fillText("IZQ: IN1="+(on("in1")?1:0)+" IN2="+(on("in2")?1:0)+" ENA="+L.pwm, 10, 18);
    mx.fillText("DER: IN3="+(on("in3")?1:0)+" IN4="+(on("in4")?1:0)+" ENB="+R.pwm, 10, 32);
    raf=requestAnimationFrame(frame);
  }
  let raf=requestAnimationFrame(frame);
  BUILDERS.puenteh.stop=()=>cancelAnimationFrame(raf);
  BUILDERS.puenteh.resume=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);};
}};

const ALGO={ threshold:20, cruise:70, revMs:400, turnMs:500, turnDir:"der", alternate:false, sweep:false };
function algoCode(a){
  const kw=s=>`<span class="kw">${s}</span>`, fn=s=>`<span class="fn">${s}</span>`, nu=s=>`<span class="nu">${s}</span>`, cm=s=>`<span class="cm">${s}</span>`;
  return (
`${cm("// Algoritmo de evasión — generado desde los bloques")}
${cm("// ESP32 · cárgalo tal cual (PWM con LEDC, ver Anexo E).")}
${kw("const")} ${kw("int")} ${nu("UMBRAL_CM")}   = ${nu(a.threshold)};
${kw("const")} ${kw("int")} ${nu("VEL_CRUCERO")} = ${nu(Math.round(a.cruise*2.55))};  ${cm("// "+a.cruise+"% de 255")}
${kw("const")} ${kw("int")} ${nu("T_REVERSA")}   = ${nu(a.revMs)};
${kw("const")} ${kw("int")} ${nu("T_GIRO")}      = ${nu(a.turnMs)};
${kw("bool")} girarDerecha = ${a.turnDir==="der"?"true":"false"};

${kw("void")} ${fn("loop")}() {
  ${kw("long")} d = ${fn("leerDistanciaCm")}();  ${cm("// GPIO5 TRIG / GPIO18 ECHO (divisor)")}${a.sweep?`
  d = ${fn("min")}(d, ${fn("mirarIzq")}(), ${fn("mirarDer")}());  ${cm("// barrido del servo")}`:""}

  ${kw("if")} (d < UMBRAL_CM) {
    ${fn("frenar")}();        ${fn("delay")}(${nu(120)});
    ${fn("atras")}(${nu(150)});   ${fn("delay")}(T_REVERSA);
    ${a.alternate?fn("girar")+"(girarDerecha); girarDerecha = !girarDerecha;":fn("girar")+"("+(a.turnDir==="der"?"true":"false")+");"}
    ${fn("delay")}(T_GIRO);
  } ${kw("else")} {
    ${fn("adelante")}(VEL_CRUCERO);  ${cm("// ledcWrite en GPIO25 / GPIO33")}
  }
}`);
}

    $("#dHead",p).textContent=deg.toFixed(0)+"°";
    $("#dTime",p).textContent=sim.t.toFixed(1);
    const hits=$("#dHits",p); hits.textContent=sim.collisions;
    hits.style.color=sim.collisions?"var(--bad)":"var(--ok)";
    let odo=0; for(let i=1;i<sim.trail.length;i++) odo+=Math.hypot(sim.trail[i][0]-sim.trail[i-1][0],sim.trail[i][1]-sim.trail[i-1][1]);
    $("#dOdo",p).textContent=odo.toFixed(0);
    spark.push(Math.min(sim.dist,120)); if(spark.length>60)spark.shift();
    const pts=spark.map((v,i)=>(i/59*200)+","+(44-v/120*40)).join(" ");
    $("#sparkline",p).setAttribute("points",pts);
  }
  function loop(){
    const dt=0.05;
    const d=sim.readUltrasonic(obstacles,AW,AH);
    const trimL=cfg.trim<0?1+cfg.trim/100:1, trimR=cfg.trim>0?1-cfg.trim/100:1;
    if(phase==="cruise"){
      sim.state="AVANZA"; const pw=Math.round(cfg.cruise*2.55);
      sim.pwmL=pw*trimL;sim.pwmR=pw*trimR;
      if(d<cfg.threshold){phase="rev";phaseT=0;}
    }else if(phase==="rev"){
      sim.state="RETROCEDE"; sim.pwmL=-150;sim.pwmR=-150;phaseT+=dt*1000;
      if(phaseT>=cfg.revMs){phase="turn";phaseT=0; turnRight = cfg.alternate ? !turnRight : (cfg.turnDir==="der");}
    }else if(phase==="turn"){
      sim.state=turnRight?"GIRA DER":"GIRA IZQ";
      sim.pwmL=turnRight?175:-175; sim.pwmR=turnRight?-175:175; phaseT+=dt*1000;
      if(phaseT>=cfg.turnMs){phase="cruise";phaseT=0;}
    }
    sim.step(dt,obstacles,AW,AH);
    drawArena(px,pcv,sim,obstacles,AW,AH,{finish});
    tel();
    if(sim.x>finish.x&&sim.y>finish.y && !finished){
      finished=true; stop();
      const net=sim.t+sim.collisions*5;
      $("#dNet",p).textContent=net.toFixed(1);
      $("#verdict2",p).innerHTML=`<b style="color:var(--ok)">🏁 Meta.</b> Tiempo ${sim.t.toFixed(1)} s + ${sim.collisions*5} s penalización = <b>${net.toFixed(1)} s netos</b>.`;
      return;
    }
    if(sim.t>60){stop();$("#verdict2",p).innerHTML="<b>Se acabó el tiempo (60 s).</b> Sube la velocidad de crucero o reduce el tiempo de giro.";return;}
    raf=requestAnimationFrame(loop);
  }
  $("#start",p).onclick=()=>{ if(running)return; sync(); resetRun(); running=true; raf=requestAnimationFrame(loop); };
  $("#stopb",p).onclick=()=>{stop();$("#verdict2",p).textContent="Detenido.";};
  $("#course",p).onclick=()=>{stop();ci=(ci+1)%COURSES.length;obstacles=COURSES[ci];sim.reset(20,20,0.5);drawArena(px,pcv,sim,obstacles,AW,AH,{finish});$("#verdict2",p).textContent="Pista "+(ci+1)+" de "+COURSES.length+".";};
  sim.reset(20,20,0.5); sim.state="EN ESPERA";
  drawArena(px,pcv,sim,obstacles,AW,AH,{finish}); tel();
  BUILDERS.pista.stop=stop;
}};

BUILDERS.carrera={build(p){
  p.innerHTML=`
   <div class="mhead"><span class="kicker">Modelo MAPS · Tecmilenio</span><h2>Mapa de la carrera</h2></div>
   <p class="mlede"><b>28 certificados</b> cocreados con empresas líderes sustituyen a las materias tradicionales — modulares, apilables y personalizables. Toca cualquiera para ver qué resuelve y con qué parte del taller de hoy se conecta. El color marca el dominio.</p>
   <p class="legend">
     <span><i style="background:var(--mech)"></i>Mecánica / diseño</span>
     <span><i style="background:var(--elec)"></i>Electrónica</span>
     <span><i style="background:var(--soft)"></i>Software / control</span>
     <span><i style="background:var(--ink)"></i>Integración</span>
     <span><i style="background:var(--line-strong)"></i>Base / transversal</span>

   <div id="plan"></div>
   <div class="card" style="margin-top:8px">
     <h3>¿Qué podré hacer cuando me gradúe?</h3>
     <p style="font-size:14px">Diseñar soluciones que integran mecánica, electrónica, robótica y tecnologías emergentes · crear modelos 3D de alta precisión · aplicar robótica y automatización para optimizar procesos industriales · diseñar sistemas de control estables y precisos · dirigir proyectos tecnológicos con criterio técnico, económico y ambiental.</p>
     <p class="note"><b>9 de cada 10</b> estudiantes consiguen empleo alineado a su Propósito de Vida <b>antes de graduarse</b>, y el <b>100%</b> se gradúa con al menos 6 meses de experiencia profesional. Te formas con tecnología de Universal Robots, Siemens, Festo, Omron y Cisco.</p>
   </div>`;
  const plan=$("#plan",p), cd=$("#cd",p);
  PLAN.forEach(sem=>{
    const w=el("div","sem"); w.appendChild(el("h4",null,sem.s));
    const g=el("div","certs");
    sem.c.forEach(ct=>{
      const c=el("div","cert"); c.dataset.area=ct.a;
      c.innerHTML=`<div class="cn">${ct.n}</div><div class="cd">${ct.d}</div>`;
      c.onclick=()=>{
        cd.classList.add("show");
        cd.innerHTML=`<b>${ct.n}</b> — ${ct.d}${ct.r?`<br><span style="color:var(--accent)">↳ En el taller de hoy: ${ct.r}</span>`:""}`;
        cd.scrollIntoView({behavior:"smooth",block:"nearest"});
      };
      g.appendChild(c);
    });
    w.appendChild(g); plan.appendChild(w);
  });
}};
